name: Verify packaged gem
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-artifact:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  record:
    name: Verify published version and tag
    if: github.event_name == 'workflow_dispatch' && !inputs.package-artifact && startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-22.04
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the release commit with main and RubyGems
        id: check
        run: |
          if bash bin/verify-release-record "$GITHUB_REF_NAME" HEAD "$GITHUB_SHA"; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "Running the full matrix for this commit."
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

  requests:
    needs: record
    if: ${{ !cancelled() && needs.record.result != 'failure' && needs.record.outputs.verified != 'true' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "3.0.3", rails: "6.1.5", rack: "2.2.4", apipie: "0.8.1" }
          - { ruby: "3.1.3", rails: "6.1.5", rack: "2.2.3", apipie: "0.8.1" }
          - { ruby: "3.1.3", rails: "6.1.7.6", rack: "2.2.8", apipie: "0.8.1" }
          - { ruby: "3.1.4", rails: "6.1.7.6", rack: "2.2.8", apipie: "0.8.1" }
          - { ruby: "3.1.4", rails: "6.1.7.6", rack: "2.2.8", apipie: "0.8.0" }
          - { ruby: "3.1.4", rails: "6.1.7.6", rack: "2.2.9", apipie: "0.8.2" }
          - { ruby: "3.1.4", rails: "6.1.7.6", rack: "2.2.21", apipie: "0.8.1" }
          - { ruby: "3.1.6", rails: "6.1.7.6", rack: "2.2.8", apipie: "0.8.1" }
          - { ruby: "3.2.9", rails: "6.1.7.6", rack: "2.2.9", apipie: "0.8.1" }
          - { ruby: "3.2.2", rails: "7.1.3.4", rack: "3.1.7", apipie: "1.4.0" }
          - { ruby: "3.2.2", rails: "7.1.3.4", rack: "3.1.7", apipie: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: 2.4.22
      - name: Check manual version increments
        if: matrix.apipie == '' && !inputs.package-artifact
        run: ruby test/release_versions.rb
      - uses: actions/download-artifact@v4
        if: inputs.package-artifact
        with:
          name: ${{ inputs.package-artifact }}
          path: candidate
      - run: ruby bin/verify "${{ matrix.rails }}" "${{ matrix.rack }}"
        env:
          VERIFY_PACKAGE: ${{ inputs.package-artifact && 'candidate/request-rescue.gem' || '' }}
          APIPIE_VERSION: ${{ matrix.apipie }}
      - uses: actions/upload-artifact@v4
        with:
          name: requests-${{ matrix.ruby }}-${{ matrix.rails }}-${{ matrix.rack }}-apipie-${{ matrix.apipie }}
          path: |
            pkg/request-rescue-*/*.gem
            pkg/request-rescue-*/Gemfile.lock
            pkg/request-rescue-*/results.json

  ci:
    name: All request tests passed
    needs: [record, requests]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Require a verified release record or a passing matrix
        env:
          RECORD: ${{ needs.record.result }}
          VERIFIED: ${{ needs.record.outputs.verified }}
          MATRIX: ${{ needs.requests.result }}
        run: |
          case "$RECORD/$VERIFIED/$MATRIX" in
            success/true/skipped | success/false/success | skipped//success) exit 0 ;;
            *) echo "Unexpected verification results: $RECORD/$VERIFIED/$MATRIX"; exit 1 ;;
          esac
