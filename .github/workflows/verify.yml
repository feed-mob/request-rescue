name: Verify packaged gem
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  requests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "3.0.3", rails: "6.1.5", rack: "2.2.4", apipie: "0.8.1" }
          - { ruby: "3.1.3", rails: "6.1.5", rack: "2.2.3", apipie: "0.8.1" }
          - { ruby: "3.1.3", rails: "6.1.7.6", rack: "2.2.8", apipie: "0.8.1" }
          - { ruby: "3.1.4", rails: "6.1.7.6", rack: "2.2.8", apipie: "0.8.1" }
          - { ruby: "3.1.4", rails: "6.1.7.6", rack: "2.2.8", apipie: "0.8.0" }
          - { ruby: "3.1.4", rails: "6.1.7.6", rack: "2.2.9", apipie: "0.8.2" }
          - { ruby: "3.1.4", rails: "6.1.7.6", rack: "2.2.21", apipie: "0.8.1" }
          - { ruby: "3.1.6", rails: "6.1.7.6", rack: "2.2.8", apipie: "0.8.1" }
          - { ruby: "3.2.9", rails: "6.1.7.6", rack: "2.2.9", apipie: "0.8.1" }
          - { ruby: "3.2.2", rails: "7.1.3.4", rack: "3.1.7", apipie: "1.4.0" }
          - { ruby: "3.2.2", rails: "7.1.3.4", rack: "3.1.7", apipie: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: 2.4.22
      - run: ruby bin/verify "${{ matrix.rails }}" "${{ matrix.rack }}"
        env:
          APIPIE_VERSION: ${{ matrix.apipie }}
      - uses: actions/upload-artifact@v4
        with:
          name: requests-${{ matrix.ruby }}-${{ matrix.rails }}-${{ matrix.rack }}-apipie-${{ matrix.apipie }}
          path: |
            pkg/request-rescue-*/*.gem
            pkg/request-rescue-*/Gemfile.lock
            pkg/request-rescue-*/results.json

  ci:
    name: All request tests passed
    needs: requests
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Require the full matrix to succeed
        run: test "${{ needs.requests.result }}" = success
