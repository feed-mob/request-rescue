name: Publish gem to RubyGems
run-name: ${{ inputs.publish && 'Publish gem to RubyGems' || 'Dry run – build and verify gem' }}

"on":
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      publish:
        description: Publish to RubyGems (unchecked runs a dry run)
        type: boolean
        default: false

env:
  BUMP: ${{ inputs.bump }}

permissions:
  contents: read

concurrency: ${{ inputs.publish && 'rubygems-release' || format('rubygems-readonly-{0}', github.run_id) }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Require main for publishing
        if: inputs.publish
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.9"
      - name: Resolve the selected version
        id: resolve
        run: |
          current=$(ruby -r ./lib/request_rescue/version -e 'print RequestRescue::VERSION')
          latest_tag=$(git tag --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !seen++')
          version=$(ruby bin/prepare-release "$BUMP")
          latest=$(curl -fsS --retry 3 https://rubygems.org/api/v1/gems/request-rescue.json | jq -er '.version')
          {
            echo "## Selected version: $version"
            echo
            echo "Source version: $current · Latest tag: ${latest_tag:-none} · Latest on RubyGems: $latest"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$latest" != "$current" && ! ( "$GITHUB_RUN_ATTEMPT" -gt 1 && "$latest" == "$version" ) ]]; then
            echo "RubyGems is at $latest. Merge its version update before releasing from $current." >&2
            exit 1
          fi
          if [[ -n "$latest_tag" && "$latest_tag" != "v$current" && ! ( "$GITHUB_RUN_ATTEMPT" -gt 1 && "$latest_tag" == "v$version" ) ]]; then
            echo "The source version $current does not match the latest release tag $latest_tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the selected version
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          gem build request-rescue.gemspec --strict --output request-rescue.gem
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: request-rescue.gem
          if-no-files-found: error
          overwrite: true

  verify:
    needs: prepare
    uses: ./.github/workflows/verify.yml
    with:
      package-artifact: release-candidate

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.9"
      - name: Verify the release App installation before publishing
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Check the published checksum on retry
        id: registry
        run: |
          url="https://rubygems.org/api/v2/rubygems/request-rescue/versions/$VERSION.json"
          status=$(curl --silent --show-error --retry 3 -o version.json -w '%{http_code}' "$url")
          case "$status" in
            200)
              published=$(jq -er '.sha' version.json)
              echo "$published  request-rescue.gem" | sha256sum --check
              ;;
            404) echo "push=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "RubyGems lookup returned HTTP $status" >&2; exit 1 ;;
          esac
      - name: Authenticate with RubyGems
        if: steps.registry.outputs.push == 'true'
        uses: rubygems/configure-rubygems-credentials@c6ca7f4bac0e29c9bde8eeae0a0a986b27efa05f # v2.2.0
        with:
          owner: "256982"
      - name: Publish the verified package
        if: steps.registry.outputs.push == 'true'
        run: gem push --host https://rubygems.org request-rescue.gem

  record:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [prepare, publish]
    environment: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.9"
      - name: Get a release App token for the version PR
        id: release-app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Tag the released source and open its version update
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash bin/record-release

      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: pkg
      - name: Publish GitHub Release notes and the verified gem
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mv pkg/request-rescue.gem "pkg/request-rescue-$VERSION.gem"
          bash bin/github-release
